[build]
  command = "npm run build"
  publish = "dist"

# Proxy all /api/* requests to the live backend server
[[redirects]]
  from = "/api/*"
  to = "https://ais-pre-rutbzyhwvqb3tney7cshne-16516054101.asia-east1.run.app/api/:splat"
  status = 200
  force = true

# Route all remaining paths to index.html for React SPA client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
