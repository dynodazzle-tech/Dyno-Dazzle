[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route all API requests to the Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Route all remaining paths to index.html for React SPA client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
